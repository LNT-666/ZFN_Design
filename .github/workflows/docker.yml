name: publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test the built image
        shell: bash
        run: |
          # Pull back what was just pushed and run it. The tag list comes from
          # metadata-action (already lowercased); the first entry is the most
          # specific one, e.g. ghcr.io/lnt-666/zfn_design:v0.8.1.
          image="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "running $image"
          docker run --rm "$image" zfn-design info
          docker run --rm "$image" python -c "import zfn_design, sys; print('import ok', zfn_design.__version__, sys.version.split()[0])"
          # The packaged smoke test is not copied into the image, so run it from
          # the checkout against the image's own interpreter path instead.
          docker run --rm "$image" python -c "from zfn_design import pipeline; print('pipeline import ok')"
