name: portability

# NAR stand-alone applications must "run on any operating system". GitHub's
# hosted runners are one machine per operating system, so this matrix is the
# evidence: the same install + CLI + smoke test + test suite on Linux, macOS
# and Windows, from a clean checkout with no manual setup.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Report commit under test
        shell: bash
        run: |
          echo "sha=${{ github.sha }}"
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
          uname -a || true
          python -c "import sys, platform; print(sys.version); print(platform.platform())"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel numpy pyahocorasick pytest
          python -m pip install -e .

      - name: CLI self-check
        shell: bash
        run: zfn-design info

      - name: Headless smoke test (S1 pipeline + fusion CDS)
        shell: bash
        run: python packaging/smoke_test.py

      - name: Test suite
        shell: bash
        run: python -m pytest -q

      - name: Docker round trip (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build -f packaging/Dockerfile -t zfn-websuite:ci .
          docker run --rm zfn-websuite:ci zfn-design info
          docker run --rm zfn-websuite:ci python -c "import zfn_design; print('import ok', zfn_design.__version__)"
